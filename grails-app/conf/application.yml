info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
grails:
  plugin:
    databasemigration:
      changelogFileName: changelog.groovy
      updateOnStart: true
      updateOnStartFileName: changelog.groovy
  codegen:
    defaultPackage: linketinder.rest.api
  profile: rest-api
  views:
    default:
      codec: html
  mime:
    disable:
      accept:
        header:
          userAgents:
          - Gecko
          - WebKit
          - Presto
          - Trident
    types:
      json:
      - application/json
      - text/json
      hal:
      - application/hal+json
      - application/hal+xml
      xml:
      - text/xml
      - application/xml
      atom: application/atom+xml
      css: text/css
      csv: text/csv
      js: text/javascript
      rss: application/rss+xml
      text: text/plain
      all: '*/*'
dataSource:
  pooled: true
  jmxExport: true
  driverClassName: org.postgresql.Driver
  dialect: org.hibernate.dialect.PostgreSQLDialect
  username: ${DB_USER}
  password: ${DB_PASSWORD}

environments:
  development:
    dataSource:
      dbCreate: none
      url: ${DB_URL}

  test:
    dataSource:
      dbCreate: create-drop
      url: ${DB_TEST_URL}

  production:
    dataSource:
      dbCreate: validate
      url: ${DB_URL}
      properties:
        jmxEnabled: true
        initialSize: 5
        maxActive: 50
        minIdle: 5
        maxIdle: 25
        maxWait: 10000
        validationQuery: SELECT 1
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
